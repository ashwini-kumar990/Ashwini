<!DOCTYPE html>
<html>
<head>
<title>AI Student Support Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;background:#f2f6fb;padding:30px 15px}
.box{max-width:650px;margin:auto;background:white;padding:25px;border-radius:12px}
input{width:100%;box-sizing:border-box;padding:12px;margin:12px 0;border:1px solid #ccc;border-radius:7px}
button{width:100%;padding:12px;border:0;border-radius:7px;background:#1f6feb;color:white;font-size:16px}
.answer{margin-top:20px;padding:15px;background:#eef6ff;border-radius:8px}
</style>
</head>
<body><div class="box">
<h1>AI Student Support Assistant</h1>
<p>Ask a college-related question.</p>
<form method="POST">
<input name="question" placeholder="Example: What are the library rules?" value="{{ question }}">
<button>Ask</button>
</form>
{% if answer %}<div class="answer"><b>Assistant:</b><br><br>{{ answer }}</div>{% endif %}
</div></body></html>
